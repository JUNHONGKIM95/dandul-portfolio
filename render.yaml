services:
  - type: web
    name: dandul-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JPA_DDL_AUTO
        value: update
      - key: FLYWAY_ENABLED
        value: true
      - key: APP_STORAGE_MODE
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: jhsm-media
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: APP_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: APP_PUSH_VAPID_SUBJECT
        sync: false
