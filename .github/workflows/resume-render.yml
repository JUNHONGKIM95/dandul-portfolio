name: Resume Render Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Find and resume DANDUL backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          services_json="$(curl --fail --silent --show-error \
            --url 'https://api.render.com/v1/services?limit=100' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}")"

          service_id="$(printf '%s' "${services_json}" | python3 -c '
          import json
          import sys

          for item in json.load(sys.stdin):
              service = item.get("service", item)
              if service.get("name") == "dandul-api-9dhn":
                  print(service["id"])
                  break
          ')"

          if [[ -z "${service_id}" ]]; then
            echo 'Could not find dandul-api-9dhn in this Render account.' >&2
            exit 1
          fi

          status="$(curl --silent --show-error \
            --output resume-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url "https://api.render.com/v1/services/${service_id}/resume" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}")"

          echo "Render resume HTTP status: ${status}"
          if [[ "${status}" != '202' ]]; then
            cat resume-response.json
            exit 1
          fi
