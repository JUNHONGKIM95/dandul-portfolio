spring.application.name=jhsm-backend
server.port=${PORT:8080}
debug=false
logging.level.org.springframework=INFO

spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/jhsm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jackson.time-zone=Asia/Seoul

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.200.174:3000,http://localhost:5173,http://127.0.0.1:5173,http://192.168.200.174:5173}
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.local-root=${APP_STORAGE_LOCAL_ROOT:uploads}
app.storage.local-public-base-url=${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase-bucket=${SUPABASE_STORAGE_BUCKET:jhsm-media}
app.push.vapid.public-key=${APP_PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${APP_PUSH_VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${APP_PUSH_VAPID_SUBJECT:mailto:dandul@example.com}
app.google-calendar.client-id=${GOOGLE_CLIENT_ID:}
app.google-calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google-calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google-calendar/oauth/callback}
app.google-calendar.scope=${GOOGLE_CALENDAR_SCOPE:https://www.googleapis.com/auth/calendar}
app.google-calendar.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
